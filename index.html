    <script>

        // GENERATE EQUALIZER BARS
        const waveContainer = document.getElementById('waveContainer');

        function initDeviceFingerprint() {
            let storedId = localStorage.getItem('zg_device_id');
            
            if (storedId) {
                userDeviceId = storedId;
                document.getElementById('displayDeviceId').innerText = userDeviceId;
                syncDeviceMetricsWithAdmin(userDeviceId);
            } else {
                database.ref('admin/device_counter').transaction((currentCount) => {
                    return (currentCount || 0) + 1;
                }, (error, committed, snapshot) => {
                    let sequenceNum = 1;
                    if (committed) {
                        sequenceNum = snapshot.val();
                    } else {
                        sequenceNum = Math.floor(Math.random() * 800) + 11;
                    }
                    const formattedId = `zgx9t-${String(sequenceNum).padStart(3, '0')}`;
                    localStorage.setItem('zg_device_id', formattedId);
                    userDeviceId = formattedId;
                    document.getElementById('displayDeviceId').innerText = userDeviceId;
                    syncDeviceMetricsWithAdmin(userDeviceId);
                });
            }
        }

        function syncDeviceMetricsWithAdmin(id) {
            database.ref(`admin/active_devices/${id}`).set({
                deviceId: id,
                lastActive: firebase.database.ServerValue.TIMESTAMP,
                userAgent: navigator.userAgent
            });
        }

        function toggleDeviceModal() {
            const modal = document.getElementById('deviceModal');
            if(modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                setTimeout(() => modal.classList.remove('opacity-0'), 10);
            } else {
                modal.classList.add('opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }, 250);
            }
        }

        function getYoutubeId(url) {
            if (!url) return '';
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : '';
        }

        function extractSongs(obj) {
            let songsList = [];
            function recurse(current) {
                if (!current || typeof current !== 'object') return;
                if (current.url || current.videoUrl || current.link || current.songUrl) {
                    songsList.push({
                        title: current.title || current.name || current.songName || 'Untitled Song',
                        url: current.url || current.videoUrl || current.link || current.songUrl
                    });
                    return;
                }
                Object.keys(current).forEach(key => recurse(current[key]));
            }
            recurse(obj);
            return songsList;
        }

        function loadSongsFromDatabase() {
            database.ref('/').on('value', (snapshot) => {
                const data = snapshot.val();
                allSongs = extractSongs(data);
                if(allSongs.length === 0) {
                    allSongs = [{ title: "Sample Song", url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ" }];
                }
                filteredSongs = [...allSongs];
                document.getElementById('totalSongsCount').innerText = `${allSongs.length} Songs`;
                renderSongsList();
                recoverSavedSession();
            });
        }

        /* FULL THUMBNAIL CARD DESIGN */
        function renderSongsList() {
            const container = document.getElementById('songsContainer');
            container.innerHTML = '';
            const fragment = document.createDocumentFragment();
            filteredSongs.forEach((song) => {
                const globalIndex = allSongs.indexOf(song);
                const ytId = getYoutubeId(song.url);
                const thumbUrl = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : '';

                const card = document.createElement('div');
                card.className = "song-card-item rounded-2xl overflow-hidden flex flex-col cursor-pointer group shadow-lg";
                card.onclick = () => playSong(globalIndex);

                card.innerHTML = `
                    <div class="w-full aspect-video bg-zinc-900 relative overflow-hidden">
                        <img src="${thumbUrl}" alt="full thumbnail" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80"></div>
                        <div class="absolute bottom-3 right-3 w-10 h-10 rounded-full bg-yellow-400 text-black flex items-center justify-center text-sm shadow-xl group-hover:scale-110 transition-transform">
                            <i class="fas fa-play pl-0.5"></i>
                        </div>
                    </div>
                    <div class="p-3 bg-zinc-950 flex flex-col gap-1">
                        <h3 class="text-sm font-bold text-zinc-100 group-hover:text-yellow-400 transition-colors line-clamp-2">${song.title}</h3>
                        <div class="flex items-center justify-between text-[10px] text-zinc-500 font-semibold mt-1">
                            <span>Zubeen Garg Official</span>
                            <span class="text-yellow-400/80">Tap to Play</span>
                        </div>
                    </div>
                `;
                fragment.appendChild(card);
            });
            container.appendChild(fragment);
        }

        function refreshVideoFramePosition() {
            const holder = document.getElementById('unifiedVideoHolder');
            holder.classList.remove('hidden');
            if(isPlayerFullscreen) {
                const anchor = document.getElementById('fullPlayerAnchor');
                const bounds = anchor.getBoundingClientRect();
                holder.style.top = `${bounds.top}px`;
                holder.style.left = `${bounds.left}px`;
                holder.style.width = `${bounds.width}px`;
                holder.style.height = `${bounds.height}px`;
                holder.style.zIndex = "51";
                holder.style.borderRadius = "12px";
            } else {
                holder.style.bottom = "8px";
                holder.style.left = "8px";
                holder.style.top = "auto";
                holder.style.width = "80px";
                holder.style.height = "44px";
                holder.style.zIndex = "41";
                holder.style.borderRadius = "4px";
            }
        }

        window.addEventListener('resize', refreshVideoFramePosition);

        function playSong(index, startAtSeconds = 0) {
            if (index < 0 || index >= allSongs.length) return;
            
            const isSameSong = (currentSongIndex === index);
            currentSongIndex = index;
            const song = allSongs[index];
            const ytId = getYoutubeId(song.url);

            if(!ytId) return;

            document.getElementById('fullPlayerTitle').innerText = song.title;
            document.getElementById('miniPlayerTitle').innerText = song.title;
            
            document.getElementById('miniPlayer').classList.remove('hidden');
            document.getElementById('miniPlayer').classList.add('flex');

            localStorage.setItem('zg_last_index', currentSongIndex);

            const holder = document.getElementById('unifiedVideoHolder');
            holder.classList.remove('hidden');
            refreshVideoFramePosition();

            if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
                if (!isSameSong) {
                    ytPlayer.loadVideoById({
                        videoId: ytId,
                        startSeconds: startAtSeconds
                    });
                }
            } else {
                document.getElementById('ytPlayerContainer').innerHTML = '';
                ytPlayer = new YT.Player('ytPlayerContainer', {
                    height: '100%',
                    width: '100%',
                    videoId: ytId,
                    playerVars: { 
                        'controls': 0, 
                        'disablekb': 1, 
                        'rel': 0, 
                        'modestbranding': 1, 
                        'iv_load_policy': 3, 
                        'fs': 0, 
                        'playsinline': 1,
                        'showinfo': 0,
                        'autohide': 1
                    },
                    events: {
                        'onReady': (e) => { 
                            if(startAtSeconds > 0) e.target.seekTo(startAtSeconds, true);
                            e.target.playVideo(); 
                            refreshVideoFramePosition();
                            startTimelineSync(); 
                        },
                        'onStateChange': onPlayerStateChange
                    }
                });
            }
        }

        function onPlayerStateChange(event) {
            const fIcon = document.getElementById('fullPlayIcon');
            const mIcon = document.getElementById('miniPlayIcon');

            if (event.data == YT.PlayerState.PLAYING) {
                fIcon.className = "fas fa-pause";
                mIcon.className = "fas fa-pause";
                startTimelineSync();
                runDynamicDiscoEngine(true);
                animateWave(true);
            } else {
                fIcon.className = "fas fa-play pl-0.5";
                mIcon.className = "fas fa-play pl-0.5";
                clearInterval(timelineInterval);
                runDynamicDiscoEngine(false);
                animateWave(false);
            }
            if (event.data == YT.PlayerState.ENDED) playNext();
        }

        function toggleDiscoSystem() {
            isDiscoEnabled = !isDiscoEnabled;
            const btn = document.getElementById('discoToggleBtn');
            if(isDiscoEnabled) {
                btn.innerText = "ON";
                btn.className = "bg-yellow-400 text-black px-1.5 py-0.5 rounded text-[8px] font-black uppercase tracking-wider transition-all";
                if(ytPlayer && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
                    runDynamicDiscoEngine(true);
                    animateWave(true);
                }
            } else {
                btn.innerText = "OFF";
                btn.className = "bg-zinc-800 text-zinc-400 px-1.5 py-0.5 rounded text-[8px] font-black uppercase tracking-wider transition-all";
                runDynamicDiscoEngine(false);
                animateWave(false);
            }
        }

        function animateWave(start) {
            clearInterval(waveAnimationInterval);
            const bars = document.querySelectorAll('.wave-bar');
            
            if (!start) {
                bars.forEach(bar => bar.style.height = '4px');
                return;
            }

            waveAnimationInterval = setInterval(() => {
                bars.forEach(bar => {
                    const randomHeight = Math.floor(Math.random() * 26) + 4; 
                    bar.style.height = `${randomHeight}px`;
                });
            }, 75);
        }

        function runDynamicDiscoEngine(shouldRun) {
            clearInterval(textRotationInterval);
            clearInterval(discoControlInterval);
            const lightBar = document.getElementById('visualizerLightBar');
            const textBox = document.getElementById('visualizerText');

            if (!shouldRun || !isDiscoEnabled) {
                lightBar.classList.remove('disco-active');
                lightBar.className = "w-full h-11 rounded-lg bg-zinc-900/90 border border-zinc-800/80 flex flex-col items-center justify-center px-4";
                return;
            }

            lightBar.classList.add('disco-active');
            textRotationIndex = 0;
            
            textRotationInterval = setInterval(() => {
                if(!allSongs[currentSongIndex]) return;
                const songTitle = allSongs[currentSongIndex].title;
                const phrases = ["Joy Zubeen Da", "#JusticeForZubeenGarg", songTitle, "DHRUBAJYOTI STUDIO"];
                
                textRotationIndex = (textRotationIndex + 1) % phrases.length;
                
                textBox.style.opacity = '0';
                setTimeout(() => {
                    textBox.innerText = phrases[textRotationIndex];
                    textBox.style.opacity = '1';
                }, 100);
            }, 2400);

            discoControlInterval = setInterval(() => {
                const waveFactor = Math.random();
                let velocity = "0.22s";
                if (waveFactor > 0.80) velocity = "0.04s";
                else if (waveFactor > 0.50) velocity = "0.1s";
                else if (waveFactor > 0.20) velocity = "0.28s";
                lightBar.style.setProperty('--disco-speed', velocity);
            }, 300);
        }

        function startTimelineSync() {
            clearInterval(timelineInterval);
            timelineInterval = setInterval(() => {
                if (ytPlayer && ytPlayer.getCurrentTime && !isDraggingTimeline) {
                    try {
                        const current = ytPlayer.getCurrentTime();
                        const duration = ytPlayer.getDuration() || 0;
                        const pct = duration > 0 ? (current / duration) * 100 : 0;
                        
                        document.getElementById('fullTimelineProgress').style.width = `${pct}%`;
                        document.getElementById('fullTimelineThumb').style.left = `${pct}%`;
                        document.getElementById('miniTimelineProgress').style.width = `${pct}%`;
                        document.getElementById('miniTimelineThumb').style.left = `${pct}%`;

                        document.getElementById('currentTimeLabel').innerText = formatTime(current);
                        document.getElementById('totalTimeLabel').innerText = formatTime(duration);

                        localStorage.setItem('zg_last_time', current);
                    } catch(err) {}
                }
            }, 250);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function seekSeconds(seconds) {
            if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function' && typeof ytPlayer.getDuration === 'function') {
                const currentTime = ytPlayer.getCurrentTime();
                const duration = ytPlayer.getDuration() || 0;
                let targetTime = currentTime + seconds;
                
                if (targetTime < 0) targetTime = 0;
                if (targetTime > duration) targetTime = duration;
                
                ytPlayer.seekTo(targetTime, true);
                
                const pct = duration > 0 ? (targetTime / duration) * 100 : 0;
                document.getElementById('fullTimelineProgress').style.width = `${pct}%`;
                document.getElementById('fullTimelineThumb').style.left = `${pct}%`;
                document.getElementById('currentTimeLabel').innerText = formatTime(targetTime);
            }
        }

        function attachTimelineEvents(containerId, progressId, thumbId) {
            const container = document.getElementById(containerId);
            function handleInteraction(e) {
                if (!ytPlayer || !ytPlayer.getDuration) return;
                const rect = container.getBoundingClientRect();
                let clickX = (e.clientX || e.touches[0].clientX) - rect.left;
                clickX = Math.max(0, Math.min(clickX, rect.width));
                const pct = clickX / rect.width;
                const targetTime = pct * (ytPlayer.getDuration() || 0);
                document.getElementById(progressId).style.width = `${pct * 100}%`;
                document.getElementById(thumbId).style.left = `${pct * 100}%`;
                return targetTime;
            }
            container.addEventListener('mousedown', (e) => {
                isDraggingTimeline = true; let t = handleInteraction(e);
                function move(me) { t = handleInteraction(me); }
                function up() { isDraggingTimeline = false; ytPlayer.seekTo(t, true); window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); }
                window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
            });
            container.addEventListener('touchstart', (e) => {
                isDraggingTimeline = true; let t = handleInteraction(e);
                function move(me) { t = handleInteraction(me); }
                function up() { isDraggingTimeline = false; ytPlayer.seekTo(t, true); window.removeEventListener('touchmove', move); window.removeEventListener('touchend', up); }
                window.addEventListener('touchmove', move); window.addEventListener('touchend', up);
            });
        }
        attachTimelineEvents('fullTimeline', 'fullTimelineProgress', 'fullTimelineThumb');
        attachTimelineEvents('miniTimeline', 'miniTimelineProgress', 'miniTimelineThumb');

        function openFullScreenPlayer() {
            if(!ytPlayer) return;
            isPlayerFullscreen = true;
            document.body.classList.add('fullscreen-lock');
            document.getElementById('fullScreenPlayer').classList.remove('hidden');
            document.getElementById('fullScreenPlayer').classList.add('flex');
            refreshVideoFramePosition();
        }

        function closeFullScreenPlayer() {
            if(!ytPlayer) return;
            isPlayerFullscreen = false;
            document.body.classList.remove('fullscreen-lock');
            document.getElementById('fullScreenPlayer').classList.add('hidden');
            document.getElementById('fullScreenPlayer').classList.remove('flex');
            refreshVideoFramePosition();
        }

        function togglePlayPause() {
            if(!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;
            const state = ytPlayer.getPlayerState();
            state === YT.PlayerState.PLAYING ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
        }

        function playNext() { if(currentSongIndex < allSongs.length - 1) playSong(currentSongIndex + 1); else playSong(0); }
        function playPrevious() { if(currentSongIndex > 0) playSong(currentSongIndex - 1); else playSong(allSongs.length - 1); }

        function closeVideo() {
            clearInterval(timelineInterval); 
            clearInterval(textRotationInterval); 
            clearInterval(discoControlInterval); 
            clearInterval(waveAnimationInterval);
            
            if(ytPlayer) { 
                try { 
                    ytPlayer.stopVideo(); 
                    ytPlayer.destroy();
                } catch(e){} 
                ytPlayer = null;
            }

            document.getElementById('ytPlayerContainer').innerHTML = '';
            document.body.classList.remove('fullscreen-lock');
            document.getElementById('miniPlayer').classList.add('hidden');
            document.getElementById('fullScreenPlayer').classList.add('hidden');
            document.getElementById('unifiedVideoHolder').classList.add('hidden');
            
            isPlayerFullscreen = false; 
            currentSongIndex = -1;
            
            localStorage.removeItem('zg_last_index'); 
            localStorage.removeItem('zg_last_time');
        }

        function recoverSavedSession() {
            const savedIndex = localStorage.getItem('zg_last_index');
            const savedTime = localStorage.getItem('zg_last_time');
            if (savedIndex !== null) {
                const index = parseInt(savedIndex);
                const startSecs = savedTime ? parseFloat(savedTime) : 0;
                if(index >= 0 && index < allSongs.length) playSong(index, startSecs);
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            filteredSongs = query === '' ? [...allSongs] : allSongs.filter(s => s.title.toLowerCase().includes(query));
            renderSongsList();
        });

        window.addEventListener('load', () => {
            initDeviceFingerprint();
            loadSongsFromDatabase();
        });
    </script>
</body>
</html>
