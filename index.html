<!DOCTYPE html>
<html lang="as">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>গছৰ ৰোগ চিনাক্তকৰণ - Public AI Plant Doctor</title>

  <!-- TensorFlow.js আৰু MobileNet AI Library (সম্পূৰ্ণ ফ্ৰী) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f0f7f4; color: #2d3748; padding: 20px; display: flex; justify-content: center; }
    .container { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 480px; width: 100%; text-align: center; }
    h1 { color: #2e7d32; font-size: 22px; margin-bottom: 8px; }
    p.subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
    
    .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
    .option-btn { flex: 1; background: #e8f5e9; border: 2px dashed #a5d6a7; border-radius: 12px; padding: 15px 10px; cursor: pointer; transition: 0.3s; font-weight: bold; color: #2e7d32; }
    .option-btn:hover { background: #c8e6c9; }
    
    #preview-container { margin-bottom: 20px; display: none; }
    #imagePreview { max-width: 100%; max-height: 250px; border-radius: 8px; border: 1px solid #ddd; }
    
    .action-btn { background: #2e7d32; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; }
    .action-btn:hover { background: #1b5e20; }
    .action-btn:disabled { background: #ccc; cursor: not-allowed; }
    
    #loader { display: none; margin: 20px 0; color: #2e7d32; font-weight: bold; }
    #result { margin-top: 20px; text-align: left; background: #fafafa; padding: 16px; border-radius: 8px; border-left: 4px solid #2e7d32; display: none; font-size: 15px; line-height: 1.6; }
    .disease-title { font-weight: bold; font-size: 18px; color: #1b5e20; margin-bottom: 8px; }
    .acc-text { background: #e8f5e9; padding: 6px 10px; border-radius: 6px; font-size: 13px; display: inline-block; margin-bottom: 12px; color: #2e7d32; }
  </style>
</head>
<body>

<div class="container">
  <h1>🌿 গছৰ ৰোগ চিনাক্তকৰণ</h1>
  <p class="subtitle">গছৰ পাতৰ ফটো তুলক আৰু ফ্ৰী AI-ৰ পৰা সমাধান লওক</p>

  <div class="btn-group">
    <div class="option-btn" onclick="document.getElementById('cameraInput').click()">
      📸 কেমেৰাৰে ফটো তুলক
    </div>
    <div class="option-btn" onclick="document.getElementById('galleryInput').click()">
      🖼️ গ্যালৰীৰ পৰা বাছক
    </div>
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="previewImage(event)">
  <input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="previewImage(event)">

  <div id="preview-container">
    <img id="imagePreview" alt="Gachhar Photo" crossorigin="anonymous">
  </div>

  <button id="scanBtn" class="action-btn" onclick="analyzePlant()" disabled>গছজোপা পৰীক্ষা কৰক</button>

  <div id="loader">⏳ AI মডেল লোড হৈ আছে... ৰ'ব...</div>
  <div id="result"></div>
</div>

<script>
  let model = null;

  // ব্ৰাউজাৰ খোলাৰ লগে লগে AI মডেলটো ব্যাকগ্ৰাউণ্ডত লোড হ'ব
  async function loadAIModel() {
    try {
      model = await mobilenet.load();
      console.log("AI Model Loaded Successfully");
    } catch (err) {
      console.error("Model load error", err);
    }
  }
  loadAIModel();

  function previewImage(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('imagePreview');
        const previewContainer = document.getElementById('preview-container');
        
        preview.src = e.target.result;
        previewContainer.style.display = 'block';
        document.getElementById('scanBtn').disabled = false;
        document.getElementById('result').style.display = 'none';
      }
      reader.readAsDataURL(file);
    }
  }

  async function analyzePlant() {
    const loader = document.getElementById('loader');
    const resultDiv = document.getElementById('result');
    const scanBtn = document.getElementById('scanBtn');
    const imgElement = document.getElementById('imagePreview');

    loader.style.display = 'block';
    resultDiv.style.display = 'none';
    scanBtn.disabled = true;

    try {
      if (!model) {
        model = await mobilenet.load();
      }

      // ব্ৰাউজাৰৰ ভিতৰতে AI-এ ফটো স্কেন কৰিব
      const predictions = await model.classify(imgElement);

      if (predictions && predictions.length > 0) {
        const topResult = predictions[0];
        const rawLabel = topResult.className;
        const score = Math.round(topResult.probability * 100);

        const formattedResult = translateResultToAssamese(rawLabel);

        resultDiv.innerHTML = `
          <div class="disease-title">🔍 ফলাফল: ${formattedResult.title}</div>
          <div class="acc-text">নিখুঁততা: ${score}%</div>
          <p><strong>💡 পৰামৰ্শ আৰু সমাধান:</strong></p>
          <p>${formattedResult.advice}</p>
        `;
        resultDiv.style.display = 'block';
      } else {
        resultDiv.innerText = "ফটোখন স্পষ্ট নহয়, পুনৰ চেষ্টা কৰক।";
        resultDiv.style.display = 'block';
      }
    } catch (error) {
      resultDiv.innerText = "স্কেন কৰাত সমস্যা হৈছে। অনুগ্ৰহ কৰি অন্য এখন স্পষ্ট ফটো আপলোড কৰক।";
      resultDiv.style.display = 'block';
    } finally {
      loader.style.display = 'none';
      scanBtn.disabled = false;
    }
  }

  function translateResultToAssamese(label) {
    const labelLower = label.toLowerCase();

    if (labelLower.includes("leaf") || labelLower.includes("plant") || labelLower.includes("tree") || labelLower.includes("flower")) {
      return {
        title: `গছ/পাত চিনাক্ত হৈছে (${label.split(',')[0]})`,
        advice: "গছজোপাত ৰোগ প্ৰতিৰোধ কৰিবলৈ নিমৰ তেল (Neem oil) চতিয়াব পাৰে আৰু নিয়মিত সূৰ্যৰ ৰ’দ লাগিবলৈ দিব।"
      };
    } else {
      return {
        title: `চিনাক্ত বস্তু: ${label.split(',')[0]}`,
        advice: "যদি ফটোখন গছৰ পাতৰ হয়, তেন্তে অধিক স্পষ্টকৈ কেৱল পাতটোৰ ফটো তুলি আপলোড কৰক।"
      };
    }
  }
</script>

</body>
</html>
