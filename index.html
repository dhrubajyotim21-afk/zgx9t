<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZG X9T - ONLY ZUBEEN DA SONG</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * { user-select: none !important; box-sizing: border-box; }
        body { background-color: #000000; color: #ffffff; font-family: system-ui, sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        .allow-scroll { touch-action: pan-y !important; overflow-y: auto !important; }
        .timeline-container { position: relative; width: 100%; height: 5px; background: #27272a; border-radius: 9999px; cursor: pointer; display: flex; align-items: center; }
        .timeline-progress { position: absolute; left: 0; top: 0; height: 100%; background: linear-gradient(90deg, #facc15, #ffffff); border-radius: 9999px; width: 0%; }
        .timeline-thumb { position: absolute; width: 12px; height: 12px; background: #ffffff; border: 2px solid #facc15; border-radius: 50%; left: 0%; transform: translateX(-50%); pointer-events: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased">

    <div id="appScrollBody" class="w-full h-full pb-36 no-scrollbar allow-scroll">
        <header class="p-4 border-b border-zinc-900 flex justify-between items-start sticky top-0 bg-black/95 backdrop-blur z-30">
            <div class="min-w-0 flex-1 pr-2">
                <h1 class="text-4xl font-black tracking-tighter uppercase">
                    <span class="text-yellow-400">ZG</span> <span class="text-white">X9T</span>
                </h1>
                <p class="text-xs font-black text-zinc-400 tracking-widest uppercase mt-1">ONLY ZUBEEN DA SONG</p>
                <div class="mt-4">
                    <input type="text" id="searchInput" placeholder="Search song..." class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-1 text-xs focus:outline-none focus:border-yellow-500 text-white">
                </div>
            </div>
        </header>

        <main class="p-4">
            <div id="songsContainer" class="flex flex-col gap-3">
                <div class="animate-pulse flex flex-col gap-3">
                    <div class="h-16 bg-zinc-900 rounded-lg"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Hidden Video Holder for YouTube API -->
    <div id="unifiedVideoHolder" class="fixed bottom-14 left-2 w-20 h-11 z-[42] bg-black rounded overflow-hidden border border-zinc-800 hidden pointer-events-none">
        <div id="ytPlayerContainer" class="w-full h-full scale-105"></div>
    </div>

    <!-- BOTTOM MINI PLAYER -->
    <div id="miniPlayer" class="fixed bottom-0 left-0 right-0 bg-zinc-950 border-t border-zinc-900 p-2 z-40 hidden flex-col gap-1 shadow-2xl">
        <div id="miniTimeline" class="timeline-container w-full">
            <div id="miniTimelineProgress" class="timeline-progress"></div>
            <div id="miniTimelineThumb" class="timeline-thumb"></div>
        </div>
        <div class="flex items-center justify-between gap-2 mt-1">
            <div class="flex items-center gap-3 flex-1 min-w-0 cursor-pointer">
                <div class="min-w-0 flex-1">
                    <h4 id="miniPlayerTitle" class="text-xs font-bold truncate text-zinc-100">Song Title</h4>
                    <p class="text-[9px] text-yellow-400 font-bold uppercase tracking-widest">Playing in background</p>
                </div>
            </div>
            <div class="flex items-center gap-2.5 shrink-0 px-1">
                <button onclick="playPrevious()" class="text-zinc-400 hover:text-white text-sm p-1"><i class="fas fa-backward-step"></i></button>
                <button onclick="togglePlayPause()" class="w-8 h-8 bg-yellow-400 rounded-full flex items-center justify-center text-black text-xs shrink-0 font-bold"><i id="miniPlayIcon" class="fas fa-play"></i></button>
                <button onclick="playNext()" class="text-zinc-400 hover:text-white text-sm p-1"><i class="fas fa-forward-step"></i></button>
                <button onclick="closeVideo()" class="text-zinc-500 hover:text-red-500 text-sm p-1 ml-0.5"><i class="fas fa-times"></i></button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDISW7EbMP_eEt4GuR6cijgMyYKxgb7xIg", 
            authDomain: "music-b05e1.firebaseapp.com", 
            databaseURL: "https://music-b05e1-default-rtdb.firebaseio.com", 
            projectId: "music-b05e1", 
            storageBucket: "music-b05e1.firebasestorage.app", 
            messagingSenderId: "771714302354", 
            appId: "1:771714302354:web:43b3f590e1ff70a851014b" 
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allSongs = [];
        let filteredSongs = [];
        let currentSongIndex = -1;
        let ytPlayer = null;
        let timelineInterval = null;

        function getYoutubeId(url) {
            if (!url) return '';
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : '';
        }

        function extractSongs(obj) {
            let songsList = [];
            function recurse(current) {
                if (!current || typeof current !== 'object') return;
                if (current.url || current.videoUrl || current.link || current.songUrl) {
                    songsList.push({
                        title: current.title || current.name || current.songName || 'Untitled Song',
                        url: current.url || current.videoUrl || current.link || current.songUrl
                    });
                    return;
                }
                Object.keys(current).forEach(key => recurse(current[key]));
            }
            recurse(obj);
            return songsList;
        }

        function loadSongsFromDatabase() {
            database.ref('/').on('value', (snapshot) => {
                const data = snapshot.val();
                allSongs = extractSongs(data);
                filteredSongs = [...allSongs];
                renderSongsList();
            });
        }

        function renderSongsList() {
            const container = document.getElementById('songsContainer');
            container.innerHTML = '';
            filteredSongs.forEach((song) => {
                const globalIndex = allSongs.indexOf(song);
                const ytId = getYoutubeId(song.url);
                const thumbUrl = ytId ? `https://img.youtube.com/vi/${ytId}/mqdefault.jpg` : '';

                const card = document.createElement('div');
                card.className = "bg-zinc-900/60 hover:bg-zinc-800 border border-zinc-900 rounded-lg p-2 flex items-center gap-3 cursor-pointer transition-all";
                card.onclick = () => playSong(globalIndex);

                card.innerHTML = `
                    <div class="w-20 h-12 bg-black rounded overflow-hidden shrink-0 border border-zinc-800">
                        <img src="${thumbUrl}" alt="thumbnail" class="w-full h-full object-cover">
                    </div>
                    <div class="min-w-0 flex-1">
                        <h3 class="text-sm font-bold text-zinc-100 truncate">${song.title}</h3>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function playSong(index) {
            if (index < 0 || index >= allSongs.length) return;
            currentSongIndex = index;
            const song = allSongs[index];
            const ytId = getYoutubeId(song.url);

            if(!ytId) return;

            document.getElementById('miniPlayerTitle').innerText = song.title;
            document.getElementById('miniPlayer').classList.remove('hidden');
            document.getElementById('miniPlayer').classList.add('flex');
            document.getElementById('unifiedVideoHolder').classList.remove('hidden');

            if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
                ytPlayer.loadVideoById(ytId);
            } else {
                ytPlayer = new YT.Player('ytPlayerContainer', {
                    height: '100%',
                    width: '100%',
                    videoId: ytId,
                    playerVars: { 'controls': 0, 'playsinline': 1 },
                    events: {
                        'onReady': (e) => { e.target.playVideo(); setupMediaSession(song); },
                        'onStateChange': (e) => {
                            if (e.data == YT.PlayerState.PLAYING) {
                                document.getElementById('miniPlayIcon').className = "fas fa-pause";
                                setupMediaSession(song);
                            } else {
                                document.getElementById('miniPlayIcon').className = "fas fa-play";
                            }
                            if (e.data == YT.PlayerState.ENDED) playNext();
                        }
                    }
                });
            }
            setupMediaSession(song);
        }

        // Media Session API যুক্ত করা হলো, যা মিনিমাইজ বা লকস্ক্রিনেও কাজ করবে
        function setupMediaSession(song) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: 'Zubeen Garg',
                    album: 'ZG X9T',
                    artwork: [{ src: `https://img.youtube.com/vi/${getYoutubeId(song.url)}/hqdefault.jpg`, sizes: '512x512', type: 'image/jpeg' }]
                });

                navigator.mediaSession.setActionHandler('play', () => togglePlayPause());
                navigator.mediaSession.setActionHandler('pause', () => togglePlayPause());
                navigator.mediaSession.setActionHandler('previoustrack', () => playPrevious());
                navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
            }
        }

        function togglePlayPause() {
            if(!ytPlayer) return;
            const state = ytPlayer.getPlayerState();
            state === YT.PlayerState.PLAYING ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
        }

        function playNext() { if(currentSongIndex < allSongs.length - 1) playSong(currentSongIndex + 1); else playSong(0); }
        function playPrevious() { if(currentSongIndex > 0) playSong(currentSongIndex - 1); else playSong(allSongs.length - 1); }

        function closeVideo() {
            if(ytPlayer) ytPlayer.stopVideo();
            document.getElementById('miniPlayer').classList.add('hidden');
            document.getElementById('unifiedVideoHolder').classList.add('hidden');
            currentSongIndex = -1;
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            filteredSongs = query === '' ? [...allSongs] : allSongs.filter(s => s.title.toLowerCase().includes(query));
            renderSongsList();
        });

        window.onload = loadSongsFromDatabase;
    </script>
</body>
</html>
