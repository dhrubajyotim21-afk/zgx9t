<!DOCTYPE html>
<html lang="as">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>গছৰ ৰোগ চিনাক্তকৰণ - Real AI Plant Doctor</title>

  <!-- Google-ৰ প্ৰকৃত AI Engine (TensorFlow.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f0f7f4; color: #2d3748; padding: 20px; display: flex; justify-content: center; }
    .container { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 480px; width: 100%; text-align: center; }
    h1 { color: #2e7d32; font-size: 22px; margin-bottom: 8px; }
    p.subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
    
    .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
    .option-btn { flex: 1; background: #e8f5e9; border: 2px dashed #a5d6a7; border-radius: 12px; padding: 15px 10px; cursor: pointer; transition: 0.3s; font-weight: bold; color: #2e7d32; }
    .option-btn:hover { background: #c8e6c9; }
    
    #preview-container { margin-bottom: 20px; display: none; }
    #imagePreview { max-width: 100%; max-height: 250px; border-radius: 8px; border: 1px solid #ddd; }
    
    .action-btn { background: #2e7d32; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; }
    .action-btn:hover { background: #1b5e20; }
    .action-btn:disabled { background: #ccc; cursor: not-allowed; }
    
    #loader { display: none; margin: 20px 0; color: #2e7d32; font-weight: bold; }
    #result { margin-top: 20px; text-align: left; background: #fafafa; padding: 16px; border-radius: 8px; border-left: 4px solid #2e7d32; display: none; font-size: 15px; line-height: 1.6; }
    .disease-title { font-weight: bold; font-size: 18px; color: #1b5e20; margin-bottom: 8px; }
    .acc-bar { background: #e0e0e0; border-radius: 10px; height: 10px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; }
    .acc-fill { background: #2e7d32; height: 100%; width: 0%; transition: width 0.5s ease; }
  </style>
</head>
<body>

<div class="container">
  <h1>🌿 গছৰ ৰোগ চিনাক্তকৰণ (Real AI)</h1>
  <p class="subtitle">গুগল AI-ৰ সহায়ত ফটো স্কেন কৰি গছৰ ৰোগ চাওক</p>

  <div class="btn-group">
    <div class="option-btn" onclick="document.getElementById('cameraInput').click()">
      📸 কেমেৰাৰে ফটো তুলক
    </div>
    <div class="option-btn" onclick="document.getElementById('galleryInput').click()">
      🖼️ গ্যালৰীৰ পৰা বাছক
    </div>
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="previewImage(event)">
  <input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="previewImage(event)">

  <div id="preview-container">
    <img id="imagePreview" alt="Gachhar Photo" crossorigin="anonymous">
  </div>

  <button id="scanBtn" class="action-btn" onclick="analyzePlantWithAI()" disabled>AI স্কেন আৰম্ভ কৰক</button>

  <div id="loader">🧠 AI-এ ফটোখন পৰীক্ষা কৰি আছে... ৰ'ব...</div>
  <div id="result"></div>
</div>

<script>
  // Google-ৰ Public Plant Disease AI Model Link
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/m4A2a3J8C/"; 
  let model, maxPredictions;

  // ব্যাকগ্ৰাউণ্ডত Google AI Model লোড কৰা
  async function initAI() {
    const modelURL = MODEL_URL + "model.json";
    const metadataURL = MODEL_URL + "metadata.json";
    model = await tmImage.load(modelURL, metadataURL);
    maxPredictions = model.getTotalClasses();
    console.log("Google AI Model Ready!");
  }
  initAI();

  function previewImage(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('imagePreview');
        const previewContainer = document.getElementById('preview-container');
        
        preview.src = e.target.result;
        previewContainer.style.display = 'block';
        document.getElementById('scanBtn').disabled = false;
        document.getElementById('result').style.display = 'none';
      }
      reader.readAsDataURL(file);
    }
  }

  async function analyzePlantWithAI() {
    const loader = document.getElementById('loader');
    const resultDiv = document.getElementById('result');
    const scanBtn = document.getElementById('scanBtn');
    const imgElement = document.getElementById('imagePreview');

    loader.style.display = 'block';
    resultDiv.style.display = 'none';
    scanBtn.disabled = true;

    try {
      if (!model) {
        await initAI();
      }

      // 🧠 সঁচা AI-এ ফটোখন স্কেন কৰি প্ৰেডিকশ্বন দিব
      const predictions = await model.predict(imgElement);
      
      // আটাইতকৈ বেছি সম্ভাৱনা থকা ফলাফলটো বাছি লোৱা
      predictions.sort((a, b) => b.probability - a.probability);
      const topPrediction = predictions[0];
      const probabilityPercent = (topPrediction.probability * 100).toFixed(1);

      // AI-ৰ ৰেজাল্ট প্ৰদৰ্শন
      resultDiv.innerHTML = `
        <div class="disease-title">🔍 AI ফলাফল: ${topPrediction.className}</div>
        <div>AI বিশ্বস্ততা (Accuracy): ${probabilityPercent}%</div>
        <div class="acc-bar">
          <div class="acc-fill" style="width: ${probabilityPercent}%;"></div>
        </div>
        <p><strong>💡 পৰামৰ্শ:</strong> ফটোখনৰ ওপৰত ভিত্তি কৰি AI-এ এই ৰোগ বা অৱস্থাটো চিনাক্ত কৰিছে। আক্ৰান্ত পাতবোৰ আঁতৰাওক আৰু প্ৰয়োজন অনুসৰি নিমৰ তেল বা জৈৱিক সাৰ ব্যৱহাৰ কৰক।</p>
      `;
      resultDiv.style.display = 'block';

    } catch (error) {
      console.error(error);
      resultDiv.innerText = "AI-এ ফটোখন পঢ়াত সমস্যা হৈছে। অনুগ্ৰহ কৰি এখন স্পষ্ট গছৰ পাতৰ ফটো আপলোড কৰক।";
      resultDiv.style.display = 'block';
    } finally {
      loader.style.display = 'none';
      scanBtn.disabled = false;
    }
  }
</script>

</body>
</html>
