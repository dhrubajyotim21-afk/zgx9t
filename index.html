<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zubeen Garg Music Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #ff0055;
      --secondary: #00f2fe;
      --bg: #0b0c10;
      --card-bg: rgba(255, 255, 255, 0.05);
      --text: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Original Disco Light Effect */
    .disco-light {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.15;
      background: radial-gradient(circle at 50% 50%, #ff0055, transparent 60%),
                  radial-gradient(circle at 20% 20%, #00f2fe, transparent 50%),
                  radial-gradient(circle at 80% 80%, #7928ca, transparent 50%);
      animation: discoPulse 4s infinite alternate ease-in-out;
    }

    @keyframes discoPulse {
      0% {
        transform: scale(1) rotate(0deg);
        filter: hue-rotate(0deg);
      }
      100% {
        transform: scale(1.2) rotate(10deg);
        filter: hue-rotate(360deg);
      }
    }

    /* Container Structure */
    .app-container {
      width: 100%;
      max-width: 900px;
      padding: 15px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Header - Adjusted Size (Smaller & Compact) */
    header {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    /* Smaller Website Name/Brand Title */
    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Live Cricket Badge with Animation */
    .cricket-live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(0, 242, 254, 0.3);
      font-size: 0.8rem;
      font-weight: 600;
      color: #00f2fe;
    }

    .cricket-icon-anim {
      display: inline-flex;
      gap: 3px;
      align-items: center;
      animation: batSwing 1.5s infinite ease-in-out;
    }

    @keyframes batSwing {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-20deg); }
    }

    .ball-pulse {
      width: 8px;
      height: 8px;
      background-color: #ff0055;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff0055;
      animation: ballGlow 1s infinite alternate;
    }

    @keyframes ballGlow {
      from { transform: scale(0.8); opacity: 0.7; }
      to { transform: scale(1.2); opacity: 1; }
    }

    /* Main Section Title - Made Bigger */
    .section-title {
      font-size: 2.2rem;
      font-weight: 800;
      text-align: center;
      margin: 10px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
      background: linear-gradient(180deg, #ffffff, #b5b5b5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Music Player Card */
    .player-card {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .album-art {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 4px solid var(--primary);
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
      object-fit: cover;
      margin-bottom: 15px;
      animation: spin 20s linear infinite;
      animation-play-state: paused;
    }

    .album-art.playing {
      animation-play-state: running;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .song-details {
      text-align: center;
      margin-bottom: 15px;
    }

    .song-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .artist-name {
      font-size: 0.9rem;
      color: #aaa;
    }

    /* Audio Wave Canvas - Set to White Only */
    .visualizer-container {
      width: 100%;
      height: 60px;
      margin: 10px 0;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    /* Controls */
    .progress-bar-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: #ccc;
      margin-bottom: 15px;
    }

    .progress-bar {
      flex: 1;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: var(--secondary);
      border-radius: 5px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s, color 0.2s;
    }

    .btn:hover {
      color: var(--secondary);
      transform: scale(1.1);
    }

    .btn-play {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
    }

    .btn-play:hover {
      transform: scale(1.05);
      color: #fff;
      background: #ff1a66;
    }

    /* Playlist Section */
    .playlist {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 15px;
      max-height: 250px;
      overflow-y: auto;
    }

    .playlist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 5px;
    }

    .playlist-item:hover, .playlist-item.active {
      background: rgba(255, 255, 255, 0.1);
    }

    .playlist-item.active {
      border-left: 3px solid var(--secondary);
    }

    .item-info h4 {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .item-info p {
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- Original Disco Background Effect -->
  <div class="disco-light"></div>

  <div class="app-container">
    <!-- Compact Header -->
    <header>
      <div class="brand-title">Zubeen Stream</div>
      
      <!-- Live Cricket Badge Animation -->
      <div class="cricket-live-badge">
        <span class="cricket-icon-anim">
          <i class="fa-solid fa-cricket-bat-ball"></i>
          <span class="ball-pulse"></span>
        </span>
        <span>aplt20_ Live Now</span>
      </div>
    </header>

    <!-- Highlighted Big Title -->
    <h1 class="section-title">Only Zubeen Song</h1>

    <!-- Player Card -->
    <div class="player-card">
      <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=400&q=80" alt="Album Cover" class="album-art" id="album-art">
      
      <div class="song-details">
        <h2 class="song-title" id="song-title">Ya Ali</h2>
        <p class="artist-name" id="artist-name">Zubeen Garg</p>
      </div>

      <!-- Wave Visualizer (White Only) -->
      <div class="visualizer-container">
        <canvas id="waveCanvas"></canvas>
      </div>

      <div class="progress-bar-container">
        <span id="current-time">0:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress" id="progress"></div>
        </div>
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button class="btn" id="prev"><i class="fa-solid fa-backward-step"></i></button>
        <button class="btn btn-play" id="play"><i class="fa-solid fa-play" id="play-icon"></i></button>
        <button class="btn" id="next"><i class="fa-solid fa-forward-step"></i></button>
      </div>
    </div>

    <!-- Playlist -->
    <div class="playlist" id="playlist">
      <!-- Songs injected via JavaScript -->
    </div>
  </div>

  <script>
    const songs = [
      { title: "Ya Ali", artist: "Zubeen Garg", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
      { title: "Mayabini", artist: "Zubeen Garg", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
      { title: "Dil Tu Hi Bataa", artist: "Zubeen Garg", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
    ];

    let currentSongIndex = 0;
    let isPlaying = false;

    const audio = new Audio(songs[currentSongIndex].src);
    const playBtn = document.getElementById('play');
    const playIcon = document.getElementById('play-icon');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const albumArt = document.getElementById('album-art');
    const songTitle = document.getElementById('song-title');
    const artistName = document.getElementById('artist-name');
    const progressBar = document.getElementById('progress-bar');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const playlistEl = document.getElementById('playlist');

    // Canvas Visualizer Setup
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    function renderPlaylist() {
      playlistEl.innerHTML = '';
      songs.forEach((song, index) => {
        const item = document.createElement('div');
        item.classList.add('playlist-item');
        if (index === currentSongIndex) item.classList.add('active');
        item.innerHTML = `
          <div class="item-info">
            <h4>${song.title}</h4>
            <p>${song.artist}</p>
          </div>
          <i class="fa-solid ${index === currentSongIndex && isPlaying ? 'fa-pause' : 'fa-play'}"></i>
        `;
        item.addEventListener('click', () => {
          currentSongIndex = index;
          loadSong(songs[currentSongIndex]);
          playSong();
        });
        playlistEl.appendChild(item);
      });
    }

    function loadSong(song) {
      songTitle.innerText = song.title;
      artistName.innerText = song.artist;
      audio.src = song.src;
      renderPlaylist();
    }

    function playSong() {
      isPlaying = true;
      playIcon.classList.remove('fa-play');
      playIcon.classList.add('fa-pause');
      albumArt.classList.add('playing');
      audio.play();
      renderPlaylist();
    }

    function pauseSong() {
      isPlaying = false;
      playIcon.classList.remove('fa-pause');
      playIcon.classList.add('fa-play');
      albumArt.classList.remove('playing');
      audio.pause();
      renderPlaylist();
    }

    playBtn.addEventListener('click', () => {
      isPlaying ? pauseSong() : playSong();
    });

    prevBtn.addEventListener('click', () => {
      currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
      loadSong(songs[currentSongIndex]);
      playSong();
    });

    nextBtn.addEventListener('click', () => {
      currentSongIndex = (currentSongIndex + 1) % songs.length;
      loadSong(songs[currentSongIndex]);
      playSong();
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const progressPercent = (audio.currentTime / audio.duration) * 100;
        progress.style.width = `${progressPercent}%`;

        let currentMin = Math.floor(audio.currentTime / 60);
        let currentSec = Math.floor(audio.currentTime % 60);
        if (currentSec < 10) currentSec = `0${currentSec}`;
        currentTimeEl.innerText = `${currentMin}:${currentSec}`;

        let durationMin = Math.floor(audio.duration / 60);
        let durationSec = Math.floor(audio.duration % 60);
        if (durationSec < 10) durationSec = `0${durationSec}`;
        durationEl.innerText = `${durationMin}:${durationSec}`;
      }
    });

    progressBar.addEventListener('click', (e) => {
      const width = progressBar.clientWidth;
      const clickX = e.offsetX;
      const duration = audio.duration;
      audio.currentTime = (clickX / width) * duration;
    });

    audio.addEventListener('ended', () => {
      nextBtn.click();
    });

    // White Wave Visualizer Animation Loop
    let phase = 0;
    function drawWave() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff'; // ONLY WHITE COLOR

      const amplitude = isPlaying ? 18 : 3;
      const frequency = 0.02;

      for (let x = 0; x < canvas.width; x++) {
        const y = canvas.height / 2 + Math.sin(x * frequency + phase) * amplitude * Math.sin(x * 0.005);
        if (x === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }

      ctx.stroke();
      phase += isPlaying ? 0.08 : 0.02;
      requestAnimationFrame(drawWave);
    }

    loadSong(songs[currentSongIndex]);
    drawWave();
  </script>
</body>
</html>
